services:
  - type: web
    name: foundation-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: cron
    name: rahab-review-ingestion
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 8-20/2 * * *"
    startCommand: python scripts/rahab_ingest_cron.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GHL_API_KEY
        sync: false

  - type: cron
    name: rahab-spike-check
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 6 * * *"
    startCommand: python scripts/rahab_spike_check_cron.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: cron
    name: zacchaeus-daily
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 7 * * *"
    startCommand: python scripts/zacchaeus_daily_cron.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # silas-slip-monitor and silas-weather-check are not defined yet -- their
  # data sources (Exterior Rescue's GPS clock-in feed, a weather provider)
  # aren't configured, so the underlying functions raise NotImplementedError
  # by design rather than fabricate data. The logic (slip_monitor.py,
  # weather.py) is real and tested; add the cron entries once a real source
  # exists for each.
  - type: cron
    name: silas-dispatch-builder
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "30 5 * * *"
    startCommand: python scripts/silas_dispatch_cron.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: cron
    name: ops-audit-nightly
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 4 * * *"
    startCommand: python scripts/ops_audit_nightly_cron.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: cron
    name: connections-health-nightly
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 3 * * *"
    startCommand: python scripts/connections_health_cron.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CONNECTION_BROKER_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

  - type: cron
    name: ops-audit-weekly-smoke
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "15 4 * * 0"
    startCommand: python scripts/ops_audit_weekly_smoke_cron.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
